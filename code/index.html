<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Alice Darcy Only!!! ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 80px;
    font-size: 3em;
    color: white;
    animation: fadeIn 2s ease-in-out;
}

p {
    font-size: 1.5em;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

#yesBtn {
    background-color: #ff4b5c;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background-color: white;
    color: #ff4b5c;
}

#surprise {
    display: none;
    font-size: 2em;
    margin-top: 30px;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<h1>💖 For you my dear 💖</h1>
<p>You have made such an impact on my life</p>
<p>May you bless me by being your E-Valentines 💌</p>
<img src="images/images.jpg" alt="Us btw! ❤️" class="romantic-img">
<p>Us btw!</p>

<button id="yesBtn">Yes 💘</button>
<button id="noBtn">No 😜</button>

<div id="surprise">🎉 YAAAY!!! Ich liebe dich!!! 💖💖💖</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const surprise = document.getElementById("surprise");
const loveSong = document.getElementById("loveSong");

let activated = false;

function teleportButton() {
    const rect = noBtn.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width;
    const maxY = window.innerHeight - rect.height;
    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

document.addEventListener("mousemove", function(e) {
    const rect = noBtn.getBoundingClientRect();
    const buttonX = rect.left + rect.width / 2;
    const buttonY = rect.top + rect.height / 2;
    const dx = e.clientX - buttonX;
    const dy = e.clientY - buttonY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < 120) {
        if (!activated) {
            noBtn.style.position = "absolute";
            activated = true;
        }
        teleportButton();
    }
});

yesBtn.addEventListener("click", function() {
    surprise.style.display = "block";
    loveSong.play();
    createConfetti();
    createHearts();
});

function createConfetti() {
    for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");
        confetti.innerHTML = "💗";
        confetti.style.position = "absolute";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = "-20px";
        confetti.style.fontSize = (10 + Math.random() * 20) + "px";
        confetti.style.opacity = Math.random();
        confetti.style.transition = "transform 3s linear, opacity 3s linear";
        document.body.appendChild(confetti);
        setTimeout(() => {
            confetti.style.transform = `translateY(${window.innerHeight + 50}px) rotate(${Math.random()*360}deg)`;
            confetti.style.opacity = 0;
        }, 50);
        setTimeout(() => { confetti.remove(); }, 3050);
    }
}

function createHearts() {
    for (let i = 0; i < 100; i++) {
        const heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.style.position = "absolute";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = Math.random() * window.innerHeight + "px";
        heart.style.fontSize = (20 + Math.random() * 40) + "px";
        heart.style.opacity = Math.random();
        heart.style.transition = "transform 4s linear, opacity 4s linear";
        document.body.appendChild(heart);
        const moveX = (Math.random() - 0.5) * 500;
        const moveY = (Math.random() - 0.5) * 500;
        setTimeout(() => {
            heart.style.transform = `translate(${moveX}px, ${moveY}px) scale(${1 + Math.random()}) rotate(${Math.random()*720}deg)`;
            heart.style.opacity = 0;
        }, 50);
        setTimeout(() => { heart.remove(); }, 4050);
    }
}

function createHeartBackground() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}
setInterval(createHeartBackground, 500);
</script>
</body>
</html>
