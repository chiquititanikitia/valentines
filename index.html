<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Alice Darcy Only!!! ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 80px;
    font-size: 3em;
    color: white;
    animation: fadeIn 2s ease-in-out;
}

p {
    font-size: 1.5em;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

#yesBtn {
    background-color: #ff4b5c;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background-color: white;
    color: #ff4b5c;
}

#surprise {
    display: none;
    font-size: 2em;
    margin-top: 30px;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<h1>💖 For you my dear 💖</h1>
<p>You have made such an impact on my life</p>
<p>May you bless me by being your E-Valentines 💌</p>
<img src="images/images.jpg" alt="Us btw! ❤️" class="romantic-img">
<p>Us btw!</p>

<button id="yesBtn">Yes 💘</button>
<button id="noBtn">No 😜</button>

<div id="surprise">🎉 YAAAY!!! Ich liebe dich!!! 💖💖💖</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const surprise = document.getElementById("surprise");

let activated = false;

// Teleport-Funktion
function teleportButton() {
    const rect = noBtn.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width;
    const maxY = window.innerHeight - rect.height;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

document.addEventListener("mousemove", function(e) {

    const rect = noBtn.getBoundingClientRect();
    const buttonX = rect.left + rect.width / 2;
    const buttonY = rect.top + rect.height / 2;

    const dx = e.clientX - buttonX;
    const dy = e.clientY - buttonY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 120) {

        // Erst jetzt absolut positionieren
        if (!activated) {
            noBtn.style.position = "absolute";
            activated = true;
        }

        teleportButton();
    }
});

yesBtn.addEventListener("click", function() {
    surprise.style.display = "block";
});
</script>
</body>
</html>
